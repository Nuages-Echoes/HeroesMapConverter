name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall h3decoder.py main.py

      # Étapes 1-3 : lecture des cartes de input/, conversion en JSON
      # dans le dossier outputjson/, puis réécriture en .h3m dans output/
      - name: Convert maps (input -> outputjson -> h3m in output/)
        run: python main.py

      # Vérification que chaque carte a bien son JSON dans outputjson/
      - name: Verify JSON outputs
        run: |
          fail=0
          for f in input/*.h3m; do
            name=$(basename "$f" .h3m)
            if [ -f "outputjson/$name.json" ]; then
              echo "$name.json : present"
            else
              echo "Missing outputjson/$name.json"
              fail=1
            fi
          done
          exit $fail

      # Étape 4 : les fichiers régénérés doivent être égaux aux originaux
      - name: Verify output files match input files
        run: |
          fail=0
          for f in input/*.h3m; do
            name=$(basename "$f")
            if [ ! -f "output/$name" ]; then
              echo "Missing output/$name"
              fail=1
              continue
            fi
            if cmp -s "$f" "output/$name"; then
              echo "$name : identical"
            else
              echo "$name : differs from input"
              fail=1
            fi
          done
          exit $fail
