name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall h3decoder.py main.py

      - name: Convert maps from input/
        run: python main.py

      - name: Check outputs
        run: |
          for f in input/*.h3m; do
            name=$(basename "$f" .h3m)
            test -f "output/$name.json" || { echo "Missing output/$name.json"; exit 1; }
          done
