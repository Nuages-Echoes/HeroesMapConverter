name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall h2decoder.py h3decoder.py unified.py main.py verify_roundtrip.py

      # Conversion de toutes les cartes de input/ : JSON détaillé dans
      # outputjson/, JSON unifié dans outputunified/, fichiers régénérés
      # dans output/
      - name: Convert maps
        run: python main.py

      # Vérification que chaque carte a bien son JSON dans outputjson/
      - name: Verify JSON outputs
        run: |
          fail=0
          for f in input/*.h3m input/*.fh2m; do
            name=$(basename "$f")
            name="${name%.*}"
            if [ -f "outputjson/$name.json" ]; then
              echo "$name.json : present"
            else
              echo "Missing outputjson/$name.json"
              fail=1
            fi
          done
          exit $fail

      # Vérification de l'aller-retour: parse(input) -> unifié -> write ->
      # parse(output) doit redonner les mêmes données que parse(input)
      - name: Verify round-trip (h3m -> h3m and fh2m -> fh2m)
        run: python verify_roundtrip.py
